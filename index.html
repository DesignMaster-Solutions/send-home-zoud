<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send Home: what your family receives</title>
<meta name="description" content="A game about sending money home from the UAE: read the fee and the rate, keep a cushion, and get it there.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f2b134'/%3E%3Cpath d='M8 17l8-8 8 8M11 15v9h10v-9' fill='none' stroke='%23142430' stroke-width='3'/%3E%3C/svg%3E">
<style>
  /* Baloo Bhaijaan 2 (SIL OFL 1.1, Ek Type), self-hosted: one face for Latin and Arabic signs and numbers. */
  @font-face{font-family:Baloo;font-weight:400 800;font-display:swap;src:url(fonts/baloo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+20A8-20B9}
  @font-face{font-family:Baloo;font-weight:400 800;font-display:swap;src:url(fonts/baloo-arabic.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFC}
  :root{--ink:#142430;--night:#0f1d27;--street:#17303d;--sand:#f4ead8;--paper:#fffaf0;--gold:#f2b134;--teal:#3fb6a8;--red:#e4572e;--muted:#9fb3bf;--fs:16px}
  *{box-sizing:border-box}
  html{font-size:var(--fs)}
  body{margin:0;min-height:100vh;background:var(--night);color:var(--sand);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Geeza Pro",sans-serif;line-height:1.45}
  body.large{--fs:21px}
  /* avoid-ai-design-ignore-file: SD2. Pure black is the high-contrast accessibility mode, chosen on purpose */
  body.contrast{--night:#000;--street:#000;--sand:#fff;--muted:#fff;--paper:#fff;--teal:#5ff2e0;--gold:#ffd23f}
  #app{max-width:980px;margin:0 auto;padding:14px 14px 40px;overflow-x:hidden}
  h1,h2,.ending,.big,.sign,.primary,.hud b,.split{font-family:Baloo,system-ui,sans-serif}
  h1{font-size:2.8rem;line-height:1;letter-spacing:.02em;margin:.3em 0 .15em;color:var(--gold);text-shadow:0 3px 0 #7a4a1c}
  .hero svg,.flight{display:block;width:100%;height:auto;border-radius:14px}
  .flight{margin:10px 0 0}
  .flight .arrived{fill:var(--gold);font:800 34px Baloo,system-ui,sans-serif}
  .grid{border-bottom:10px solid #0a1720}
  .house .win{fill:#0a1720;transition:fill .4s .2s}
  .house.lit .win{fill:var(--gold)}
  .neon{animation:neon 1.6s steps(1) infinite}
  @keyframes neon{0%,82%,90%{opacity:1}86%,94%{opacity:.25}}
  body.calm .neon{animation:none}
  .counter .facade{display:block;width:100%;height:auto}
  .grid{padding:12px;border-radius:14px;background:#13262f repeating-linear-gradient(90deg,#ffffff07 0 1px,transparent 1px 40px)}
  h2{font-size:1.3rem;margin:.2em 0 .5em}
  p{margin:.4em 0}
  .muted{color:var(--muted)}
  .panel{background:var(--street);border-radius:14px;padding:14px 16px;margin:10px 0}
  body.contrast .panel{border:2px solid #fff}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .actions{display:flex;gap:14px;align-items:center;flex-wrap:nowrap;margin-top:14px}
  button{font:inherit;cursor:pointer;border-radius:10px;border:0;white-space:nowrap}
  .primary{background:var(--gold);color:var(--ink);font-weight:700;padding:.7em 1.3em}
  .link{background:none;color:var(--sand);text-decoration:underline;padding:.4em .2em}
  .chip{background:transparent;color:var(--sand);border:1.5px solid var(--muted);padding:.35em .8em;border-radius:99px;font-size:.92rem}
  .chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--ink);font-weight:600}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .hud{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:.95rem;position:sticky;top:0;background:var(--night);padding:8px 0;z-index:2}
  .hud b{color:var(--gold)}
  .ledger div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  .plus{color:var(--teal)} .minus{color:#ff9a7a}
  .msg{background:var(--paper);color:var(--ink);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:6px 0;max-width:560px}
  [dir=rtl] .msg{border-radius:14px 14px 4px 14px}
  .msg.new{box-shadow:0 0 0 3px var(--gold)}
  .alert{border-inline-start:4px solid var(--red);padding-inline-start:10px;margin:6px 0}
  input[type=range]{width:100%;accent-color:var(--gold);height:32px}
  .split{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;gap:10px}
  .clock{height:12px;background:#0a141b;border-radius:99px;overflow:hidden;margin:6px 0}
  .clock i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
  .clock.low i{background:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .counter{background:#20414f;color:var(--sand);text-align:start;padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:150px;border:2px solid transparent}
  body.contrast .counter{background:#000;border-color:#fff}
  .counter{white-space:normal}
  .counter .sign{padding:8px 10px;font-weight:700;font-size:.95rem;color:var(--ink);background:var(--teal)}
  .counter[data-kind=bank] .sign{background:#cfd8de} .counter[data-kind=saffron] .sign{background:#f2b134}
  .counter[data-kind=dhow] .sign{background:#7fb2f0} .counter[data-kind=zero] .sign{background:#ff4f9a;color:#fff}
  .counter[data-kind=app] .sign{background:#b9e769} .counter[data-kind=informal] .sign{background:#3a3a3a;color:#fff}
  .counter .body{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
  .counter .big{font-size:1.25rem;font-weight:700}
  .counter .shout{color:#ff4f9a;font-weight:800;font-size:1.15rem;animation:blink .8s steps(2) infinite}
  body.calm .counter .shout{animation:none}
  @media (prefers-reduced-motion:reduce){.counter .shout,.neon{animation:none}.house .win{transition:none}}
  @keyframes blink{50%{opacity:.35}}
  .counter[disabled]{opacity:.4;cursor:not-allowed}
  .counter.picked{border-color:var(--gold)}
  .sheet{position:fixed;inset:auto 0 0 0;background:var(--paper);color:var(--ink);padding:16px;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px #0008;max-width:980px;margin:0 auto;z-index:5}
  .sheet .big{font-size:1.8rem;font-weight:800}
  .sheet .primary{background:var(--ink);color:var(--gold)}
  .sheet .link{color:var(--ink)}
  .receipt{background:var(--paper);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;padding:16px;border-radius:4px;max-width:460px;margin:12px auto;position:relative;box-shadow:0 6px 20px #0006}
  .receipt div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
  .receipt div span:last-child{white-space:nowrap;text-align:end}
  .receipt>p:first-of-type{padding-inline-end:64px}
  .receipt .total{border-top:1px dashed #889;margin-top:6px;padding-top:6px;font-weight:700}
  .receipt .gets{font-size:1.3rem;font-weight:800}
  .stamp{position:absolute;inset-inline-end:14px;top:10px;border:3px solid var(--red);color:var(--red);padding:2px 8px;font-weight:800;transform:rotate(-12deg);animation:stamp .35s ease-out}
  body.calm .stamp{animation:none}
  @keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}}
  .lost{background:#2a1212;border:2px solid var(--red);padding:14px;border-radius:12px}
  .stats div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #ffffff18}
  .ending{font-size:1.7rem;color:var(--gold);margin:.2em 0}
  .cap{position:fixed;inset:0 0 auto 0;margin:0;padding:14px 20px;background:#0a1720ee;color:var(--sand);font:600 1.25rem/1.3 Baloo,system-ui,sans-serif;text-align:center;z-index:20}
  .overlay{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
  @media (max-width:400px){.primary{padding:.6em .9em}.actions{gap:8px}h1{font-size:2.1rem}.grid{padding:8px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript>Send Home needs JavaScript.</noscript>
<script type="module" src="game.js?v=11"></script>
</body>
</html>
